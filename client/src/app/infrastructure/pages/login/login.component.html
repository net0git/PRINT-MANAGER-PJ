<div class="login-container">
  <div class="login-card">

    <div class="logo-box">
      <i class="bi bi-printer"></i>
    </div>

    <h1>PrintManager</h1>
    <p class="subtitle">Portal de Gestión de Componentes</p>

    <form class="login-form">

      <div class="form-group">
        <label>Usuario</label>
        <input
          type="text"
          placeholder="Usuario"
          name="usename"
          [(ngModel)]="user.username"
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input
          type="password"
          placeholder="••••••••"
          name="password"
          [(ngModel)]="user.password"
        />
      </div>

      <button type="submit" class="login-btn" (click)=" login()">
        Iniciar Sesión
      </button>
    </form>

    
    <a routerLink="/reset-cuenta" class="forgot-password">
      ¿Olvidaste tu contraseña? 
    </a>
    <a  routerLink="/registro" class="forgot-password">
      Registrarse 
    </a>

  </div>
</div>
